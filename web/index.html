<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未写之境 · Everweave</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><a class="brand" href="/">EVERWEAVE <span>未写之境</span></a><div id="connection" role="status">连接本机引擎…</div><button id="sound">开启声音</button></header>
<main>
<section id="welcome" class="panel"><p class="eyebrow">一段由你踏入的故事</p><h1>世界从一句话开始。</h1><p class="muted">写下你是谁、身在何处，以及这段旅途的目标。</p>
<label for="setting">世界设定</label><textarea id="setting" maxlength="600" rows="5" placeholder="暴雨中的海边小镇，灯塔熄灭了……"></textarea>
<div class="form-row"><label>生成方式<select id="mode"><option value="live">在线 · ChatGPT 订阅</option><option value="demo">离线体验</option></select></label><label>本次请求预算<input id="budget" type="number" min="1" max="60" value="16"></label></div>
<label for="model">Luna 模型</label><select id="model"><option value="gpt-6-luna">GPT-6 Luna</option><option value="gpt-5.6-luna">GPT-5.6 Luna</option></select>
<label for="effort">思考等级</label><select id="effort"><option value="high">High</option><option value="medium">Medium</option><option value="none">Off</option><option value="low">Low</option><option value="xhigh">XHigh</option><option value="max">Max</option></select>
<p id="authorization" class="muted"></p><button id="start" class="primary">开始旅程</button><button id="continue" hidden>继续当前旅程</button><button id="login" hidden>连接 ChatGPT</button><div id="login-info"></div></section>
<section id="game" hidden>
<div class="journey-heading"><div><p class="eyebrow" id="chapter">旅途中</p><h1 id="place">世界正在成形</h1></div><div id="resources" class="resources"></div></div>
<p id="objective" class="objective"></p>
<div class="layout"><section class="panel map-panel"><div class="map-bar"><span id="coordinates">尚未落地</span><span>WASD 移动 · E 交互 · F 动作</span><button id="stop-walk" hidden>停止寻路</button></div>
<div id="map-scroll"><canvas id="map" width="896" height="560" aria-label="当前地区地图"></canvas><div id="map-placeholder">远方正在编织…<small>章节与场景准备完成后即可出发。</small></div></div>
<div class="move-controls"><button data-move="0,-1" aria-label="向上移动">↑</button><button data-move="-1,0" aria-label="向左移动">←</button><button data-move="0,1" aria-label="向下移动">↓</button><button data-move="1,0" aria-label="向右移动">→</button><button id="interact">交互 E</button><button id="actions">当前动作 F</button><button id="wait">等待一回合</button></div>
<p id="description" class="muted"></p><p id="walk-status" role="status"></p></section>
<aside><section id="interaction" class="panel" hidden><h2 id="interaction-title"></h2><div id="dialogue"></div><div id="choices" class="button-list"></div></section>
<section class="panel"><h2>眼前的人与物</h2><p class="muted">点击对象，自动走到附近并交互；遇到事件会停下。</p><div id="objects" class="button-list"></div></section></aside></div>
<div class="lower-grid"><section class="panel"><h2>随身物品</h2><div id="inventory"></div><h3>可用能力</h3><div id="abilities" class="button-list"></div></section><section class="panel"><h2>行动目标</h2><div id="quests"></div><h3>旅途记录</h3><ol id="journal"></ol></section></div>
</section>
<div id="error" role="alert" hidden></div>
<section id="generation" class="panel"><div class="generation-heading"><h2>世界进展</h2><button id="pause" hidden>暂停后续生成</button></div><p id="generation-status">尚未开始</p><div id="failures" class="button-list"></div><details><summary>生成与运行诊断</summary><pre id="diagnostics"></pre><div class="form-row"><div><label for="settings-model">后续生成的 Luna 模型</label><select id="settings-model"><option value="gpt-6-luna">GPT-6 Luna</option><option value="gpt-5.6-luna">GPT-5.6 Luna</option></select></div><div><label for="settings-effort">后续生成的思考等级</label><select id="settings-effort"><option value="none">Off</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="xhigh">XHigh</option><option value="max">Max</option></select></div><div><label for="settings-budget">本次进程的请求上限</label><input id="settings-budget" type="number" min="1" max="1000" value="16"></div></div><button id="apply-settings" disabled>应用生成设置</button><p class="muted">在当前生成任务结束后应用。已有地区保留，后续请求使用新设置。</p></details></section>
</main><footer>本机存档 · 每一步行动自动保存</footer>
</body></html>
